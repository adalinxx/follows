<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follows</title>
<meta name="description" content="One follow list for every app. See who follows any @handle, and whom it follows.">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="brand/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#3346d3">
<style>
@font-face { font-family: "Schibsted Grotesk"; font-weight: 400 900; font-display: swap; src: url(fonts/schibsted-grotesk-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Schibsted Grotesk"; font-weight: 400 900; font-display: swap; src: url(fonts/schibsted-grotesk-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url(fonts/jetbrains-mono-400.woff2) format("woff2"); }
/* Colors from follows-brand (tokens.json): Ink, Slate, Mist, Paper, Cloud; Indigo; Haze. */
:root {
  --ink: #16181D; --muted: #5F6470; --line: #E6E7EB; --bg: #FFFFFF; --soft: #F4F5F7;
  --accent: #3346D3; --accent-ink: #1F2DA0; --avatar: #E3E6F8; --avatar-ink: #3346D3; --on-accent: #FFFFFF;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #ECEDF0; --muted: #A3A8B3; --line: #2C2F36; --bg: #121418; --soft: #1C1F24;
    --accent: #8D9BFF; --accent-ink: #B4BEFF; --avatar: #262B45; --avatar-ink: #B4BEFF; --on-accent: #121418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #ECEDF0; --muted: #A3A8B3; --line: #2C2F36; --bg: #121418; --soft: #1C1F24;
  --accent: #8D9BFF; --accent-ink: #B4BEFF; --avatar: #262B45; --avatar-ink: #B4BEFF; --on-accent: #121418;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
a:hover { color: var(--accent-ink); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.mono { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
header { border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
.brand { display: inline-flex; flex: none; padding: 8px 0; }
.brand svg { display: block; height: 24px; width: auto; }
.follows-disc { fill: var(--accent); }
.follows-ink { fill: var(--ink); }
.tail { font-family: var(--mono); font-size: 0.92em; }
#find { flex: 1; display: flex; gap: 8px; min-width: 0; }
input[type="search"] { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
button.link { all: unset; color: var(--accent); text-decoration: underline; cursor: pointer; }
button.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
input[type="search"]:focus { background: var(--bg); border-color: var(--accent); outline: none; }
button { height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }

main.wrap { padding-top: 32px; padding-bottom: 48px; }
.status { padding: 24px 0; }
.status button { margin-top: 12px; }

.person { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.person > div { min-width: 0; }
.person h1 { font-size: 26px; overflow-wrap: anywhere; }
.links a { display: inline-flex; align-items: center; min-height: 44px; }
h2.section { font-size: 15px; color: var(--muted); margin: 28px 0 4px; }
.links { margin: 6px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; font-size: 14px; }
.counts { display: flex; gap: 20px; margin: 0 0 16px; }
.counts a { color: var(--ink); text-decoration: none; padding: 10px 0; }
.counts a:hover { text-decoration: underline; }
.follow { display: flex; }
follows-button { --follows-accent: var(--accent); --follows-ink: var(--ink); --follows-line: var(--line); --follows-muted: var(--muted); }
follows-button { --follows-accent-ink: var(--on-accent); }
.back { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
.list-title { font-size: 22px; margin: 4px 0 12px; }
.more { margin-top: 16px; width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.recent { margin-top: 36px; }
.recent h2 { font-size: 15px; margin: 0 0 4px; color: var(--muted); }
.filter { display: flex; margin-bottom: 8px; }
.mine { margin-top: 36px; }
.mine h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); }
.mine > p { margin-top: 8px; max-width: 34em; }
.handle-row { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.people .handle-row > a { flex: 1; min-width: 0; border-bottom: 0; }
.people .row-counts { display: flex; flex: none; gap: 12px; }
.people .row-counts a { display: inline-flex; align-items: center; min-height: 44px; padding: 0; border-bottom: 0; color: var(--accent); text-decoration: underline; }

.people { list-style: none; margin: 0; padding: 0; }
.people a { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; min-height: 56px; }
.people a:hover strong { text-decoration: underline; }
.who { display: flex; flex-direction: column; min-width: 0; }
.who strong, .who .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 16px 0; }

.avatar { flex: none; width: var(--size); height: var(--size); border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  background: var(--avatar); color: var(--avatar-ink); font-weight: 700; font-size: calc(var(--size) * 0.42); }

/* The front page: wider than the reading column, the header with it. */
.on-home .wrap { max-width: 1040px; }
.hero { display: grid; gap: 40px; align-items: center; padding-bottom: 16px; }
.hero h1 { font-size: 32px; line-height: 1.1; font-weight: 800; margin-bottom: 16px; text-wrap: balance; }
.hero .lede { font-size: 18px; line-height: 1.45; color: var(--muted); max-width: 30em; }
.hero .mine { margin-top: 28px; }
@media (min-width: 860px) {
  .hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; padding: 24px 0 32px; }
  .hero h1 { font-size: 52px; line-height: 1.04; }
}

/* One follow, read by every app: the hero's picture, in the mark's own shapes. */
.graph { margin: 0; padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); display: grid; gap: 0; min-width: 0; }
.pair { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.node { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; font-weight: 700; }
.node i { flex: none; width: 24px; height: 24px; border-radius: 50%; }
.node .disc { background: var(--accent); }
.node .ring { border: 5px solid var(--ink); }
.edge { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.edge::after { content: ""; width: 28px; height: 2px; background: var(--muted); }
.chain { margin: 0; padding: 14px 0 14px 21px; border-left: 2px solid var(--line); margin-left: 20px; color: var(--muted); font-size: 14px; }
.readers { list-style: none; margin: 0 0 0 20px; padding: 0; display: grid; gap: 8px; border-left: 2px solid var(--line); padding-left: 21px; }
.readers li { display: grid; gap: 2px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.readers b { font-weight: 700; }
.readers span { color: var(--muted); font-size: 14px; }
.readers code { font-family: var(--mono); font-size: 13.6px; color: var(--ink); overflow-wrap: anywhere; }

.band { padding: 48px 0 8px; border-top: 1px solid var(--line); margin-top: 40px; }
.band > h2 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
.band > p { color: var(--muted); max-width: 36em; }
.steps { list-style: none; counter-reset: step; margin: 24px 0 0; padding: 0; display: grid; gap: 24px; }
.steps li { counter-increment: step; display: grid; gap: 6px; align-content: start; }
.steps li::before { content: counter(step); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--avatar); color: var(--avatar-ink); font-weight: 700; margin-bottom: 6px; }
.steps h3, .facts h3 { font-size: 18px; line-height: 1.3; margin: 0; }
.steps p, .facts p { color: var(--muted); }
.facts { display: grid; gap: 28px 40px; margin-top: 24px; }
.apps { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 16px; }
.apps a { display: grid; gap: 4px; height: 100%; padding: 20px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; }
.apps a:hover { border-color: var(--accent); }
.apps a strong { font-size: 18px; }
.apps a span { color: var(--muted); }
.apps a em { font-style: normal; color: var(--accent); font-weight: 600; margin-top: 8px; }
.code { margin: 24px 0 12px; padding: 20px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font: 13.6px/1.6 var(--mono); color: var(--ink); }
.foot { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: var(--muted); }
.foot p { flex: 1 1 20em; }
@media (min-width: 720px) {
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 480px) {
  .graph { padding: 18px; }
  .pair { gap: 8px; }
  .edge::after { width: 14px; }
  header .wrap { flex-wrap: wrap; gap: 8px; }
  #find { flex-basis: 100%; }
}
/* A heading focused after a page change marks where to start reading, without a ring. */
h1[tabindex="-1"]:focus { outline: none; }
</style>
</head>
